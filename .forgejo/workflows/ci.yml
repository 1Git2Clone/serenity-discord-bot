name: Rust, Docker, Code Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs when a branch is pushed repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Forgejo mirror of .github/workflows/full.yml. Differences, all forced by the
# runner model (jobs run *inside* a container, not on a VM):
#   - third-party actions need their full github.com URL, the runner's default
#     action registry is code.forgejo.org;
#   - service containers are reached by service name (postgres/redis), not
#     localhost. That only works because the runner sets `container.network` to
#     "" (a per-job network with DNS); on docker's default bridge there is no
#     embedded DNS and every name lookup fails. See
#     vps:modules/containers/forgejo-runner.nix.
#   - `options:` health-checks are not waited on before the first step runs, so
#     the wait loop below is what actually gates the migrations;
#   - coverage is uploaded as a run artifact instead of pushed to Codecov;
#   - there is no `docker` job. The runner sets `container.docker_host: "-"`, so
#     job containers get no docker socket, and that is deliberate — the socket
#     the runner itself mounts is root on the host. The two ways to get a build
#     anyway both cost more than this job is worth: a `docker:dind` *service*
#     needs `container.privileged: true`, which privileges EVERY job container
#     (a workflow's own `options: --privileged` is silently dropped — the
#     runner's mergeJobOptions only honours --health-*, --volume, --tmpfs,
#     --memory and --hostname); a host-side dind container needs a privileged
#     daemon reachable from the job network, i.e. from every other container on
#     the box. .github/workflows/full.yml already builds the image on every push
#     to main, which is the coverage this job would duplicate.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Deploy feature set mirrors scripts/deploy-features.sh (DEPLOY_FEATURES).
        features: ["", "--features \"opentelemetry ai-openrouter util-download\"", "--all-features"]
    env:
      SQLX_OFFLINE: true
      # Debug info is ~40% of the dev-profile target directory (2.3G -> 1.4G
      # measured on --all-features) and buys nothing here: no one debugs a CI
      # container. Compile time barely moves (375s -> 357s), but every byte
      # saved is a byte the Actions cache does not upload and download again.
      # NOT set on the `test` job — that one runs cargo llvm-cov, and its line
      # mapping is not worth risking to save a cache round-trip.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Deploy feature set mirrors scripts/deploy-features.sh (DEPLOY_FEATURES).
        features: ["", "--features \"opentelemetry ai-openrouter util-download\"", "--all-features"]
    env:
      SQLX_OFFLINE: true
      # Debug info is ~40% of the dev-profile target directory (2.3G -> 1.4G
      # measured on --all-features) and buys nothing here: no one debugs a CI
      # container. Compile time barely moves (375s -> 357s), but every byte
      # saved is a byte the Actions cache does not upload and download again.
      # NOT set on the `test` job — that one runs cargo llvm-cov, and its line
      # mapping is not worth risking to save a cache round-trip.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
      - run: cargo build --verbose ${{ matrix.features }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bot_database
      redis:
        image: redis:8

    env:
      DATABASE_URL: postgres://postgres:password@postgres:5432/bot_database
      REDIS_URL: redis://redis:6379
      RUST_BACKTRACE: full
      # Clippy/Build run before "Run database migrations", so compile sqlx's
      # query! macros against the committed .sqlx cache instead of the (empty,
      # un-migrated) live DB. Matches the local pre-commit hook, which has no
      # database. Migrations still run before the tests, which connect at runtime.
      SQLX_OFFLINE: "true"

    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      # Fails loudly, and that is the point: the first version let the loop
      # expire and fell through to `sqlx migrate run`, which reported a DNS
      # error two minutes later and named neither the host nor the service.
      - name: Wait for Postgres and Redis
        run: |
          for hostport in postgres:5432 redis:6379; do
            for i in $(seq 1 60); do
              (exec 3<>"/dev/tcp/${hostport%:*}/${hostport#*:}") 2>/dev/null && break
              if [ "$i" -eq 60 ]; then
                echo "::error::$hostport unreachable after 120s" >&2
                exit 1
              fi
              sleep 2
            done
          done
        shell: bash

      - name: Run database migrations
        run: sqlx migrate run

      - name: Run tests
        run: cargo test --verbose --all-features -- --nocapture

      - name: Install llvm-tools for coverage
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: https://github.com/taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        continue-on-error: true
        run: bash scripts/coverage.sh

      - name: Upload coverage report
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: warn
